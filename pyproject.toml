[project]
name = "prompt-assistant-reforge"
version = "2.0.7"
description = "Prompt Assistant Reforge — ComfyUI all-in-one prompt toolkit with cloud LLMs, local Ollama, and llama-swap auto VRAM unload. Maintained by Helpful Old Wang. 提示词小助手 Reforge：支持云端大模型、本地 Ollama 与 llama-swap 自动卸载显存。发布者：Helpful Old Wang。"
readme = "README.md"
license = {text = "GNU General Public License v3"}
classifiers = [
    "Operating System :: OS Independent"  
]
dependencies = [
    "comfyui-frontend-package>=1.39.16"
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.comfy]
PublisherId = "helpful-old-wang"
DisplayName = "Prompt Assistant Reforge"
Icon = "https://raw.githubusercontent.com/yawiii/assets/refs/heads/main/prompt_assistant/icon.png"
